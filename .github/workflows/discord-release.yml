name: Release naar Discord

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      titel:
        description: Titel van het testbericht
        default: Testbericht
      tekst:
        description: Tekst van het testbericht
        default: De Discord-koppeling werkt.

jobs:
  discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Een release maakt ook een tag aan. Die tag-run slaan we over, zodat
      # er maar één bericht komt: de release-run heeft de releasenotes.
      - name: Bepalen of er al een release bij de tag hoort
        id: check
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sleep 15
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bericht naar Discord sturen
        if: steps.check.outputs.skip != 'true'
        env:
          SYD_URL: ${{ secrets.SYD_ANNOUNCE_URL }}
          SYD_TOKEN: ${{ secrets.SYD_ANNOUNCE_TOKEN }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_NAAM: ${{ github.event.repository.name }}
          TITEL: ${{ github.event.release.name || github.event.release.tag_name || inputs.titel }}
          TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
          TEKST: ${{ github.event.release.body || inputs.tekst || github.event.head_commit.message }}
          URL: ${{ github.event.release.html_url || github.event.repository.html_url }}
        run: |
          if [ -n "$SYD_URL" ] && [ -n "$SYD_TOKEN" ]; then
            # SYD plaatst het bericht zelf, met zijn eigen naam en plaatje.
            payload=$(jq -n --arg titel "${TITEL:-$TAG}" --arg tekst "${TEKST:0:3500}" --arg url "$URL" \
              '{titel: ("🚀 " + $titel), beschrijving: $tekst, url: $url, kleur: "#B58BFF"}')
            curl -sS --fail -H "Authorization: Bearer $SYD_TOKEN" -H "Content-Type: application/json" -d "$payload" "$SYD_URL"
          elif [ -n "$WEBHOOK_URL" ]; then
            # Terugval zolang SYD nog niet is ingesteld: een webhook toont niet de botidentiteit.
            payload=$(jq -n --arg titel "${TITEL:-$TAG}" --arg tekst "${TEKST:0:3500}" --arg url "$URL" \
              '{username: "SYD", embeds: [{title: ("🚀 " + $titel), url: $url, description: $tekst, color: 11863295}]}')
            curl -sS --fail -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
          else
            echo "Geen SYD_ANNOUNCE_URL/SYD_ANNOUNCE_TOKEN en geen DISCORD_WEBHOOK_URL ingesteld" >&2
            exit 1
          fi
