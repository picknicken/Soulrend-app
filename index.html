<style>
/* Layout: full-screen canvas world, thin HUD on top, four round quick buttons bottom-right, dialogue box bottom.
   One committed look: low-poly 3D overworld, so colours are explicit and single-theme. */
:root{--ink:#e9ecdf;--ink2:#a9b3a6;--panel:rgba(18,24,22,.94);--line:rgba(255,255,255,.14);--amber:#e8a94d;--red:#d9604b;
  --font-d:"Alegreya SC",Georgia,serif;--font-b:"Alegreya Sans",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;padding:0;background:#10151a;color:var(--ink);font:16px/1.3 var(--font-b);overflow:hidden;overscroll-behavior:none}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px}
#hud>*{pointer-events:auto}
#top{display:flex;gap:10px;align-items:center}
#hp{position:relative;flex:1;max-width:150px;height:22px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:11px;overflow:hidden}
#hp i{position:absolute;inset:0 auto 0 0;width:100%;background:#4f9a55;transition:width .25s}
#hp b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--font-b);text-shadow:0 1px 2px #000}
#lvl{font:700 15px var(--font-d);letter-spacing:.04em;text-shadow:0 1px 3px #000}
#mapBtn,#bag{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(0,0,0,.55);color:var(--ink);font:700 16px var(--font-b)}
#mapBtn{margin-left:auto}
#bag{padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(0,0,0,.55);color:var(--ink);font:700 16px var(--font-b)}
#hint{margin-top:8px;font-size:15px;color:var(--ink);text-shadow:0 1px 3px #000,0 0 8px #000;max-width:420px}
#zone{margin-top:6px;display:inline-block;font:700 13px var(--font-b);padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.5);color:var(--ink2);text-shadow:none}
#zone.multi{background:var(--red);color:#fff}#zone.safe{background:#2f6a3f;color:#fff}
#loot{position:absolute;left:14px;right:14px;top:18%;max-width:420px;margin:0 auto;background:rgba(20,24,30,.97);border:2px solid #c9a24a;border-radius:12px;padding:14px 16px;pointer-events:auto}
#loot h3{margin:0 0 8px;font:700 20px var(--font-d);color:var(--amber);letter-spacing:.03em}
#loot .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
#loot .rare{color:#ffd24a;font-weight:700}
#loot small{display:block;margin-top:8px;color:var(--ink2)}
#tele{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){#tele{animation:pulse .5s ease-in-out infinite alternate}}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
#quick{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#quick button{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.6);color:var(--ink);font:700 13px/1.1 var(--font-b);padding:0}
#quick button small{display:block;font:500 12px var(--font-b);color:var(--amber)}
#quick button:disabled{opacity:.4}
#quick button.on{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
#quick button.alert{border-color:var(--red);background:var(--red);color:#fff}
#craft{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:rgba(20,24,30,.98);border-top:2px solid #7f8794;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#craft h3{margin:0;font:700 22px var(--font-d);letter-spacing:.03em}
#craft .rc{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
#craft .rc.lock{opacity:.55}
#craft .rc .tx{flex:1;min-width:0}
#craft .rc b{display:block}
#craft .rc small{display:block;color:var(--ink2);font-size:14px}
#craft .rc .ok{color:#8fe08f}#craft .rc .no{color:#ff8a76}
#craft .btns{display:flex;gap:6px}
#craft button,#panel .tabs button,#panel .act button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 15px var(--font-b)}
#craft button:disabled{opacity:.4}
#craft .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ic{width:38px;height:38px;flex:none;filter:url(#icfx)}.xpi{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:30px;height:30px;filter:drop-shadow(0 1px 2px #000)}
#panel .tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
#panel .tabs button.on{border-color:var(--amber);color:var(--amber)}
#panel .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
#panel .cell{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05);display:grid;place-items:center;padding:0;min-height:0}
#panel .cell.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
#panel .cell.empty{opacity:.35}
#panel .cell .ic{width:70%;height:70%}
#panel .cell em{position:absolute;right:5px;bottom:2px;font:700 12px var(--font-b);font-style:normal;color:#ffe58a;text-shadow:0 1px 2px #000}
#panel .eq{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}
#panel .eq .cell{aspect-ratio:auto;height:78px;align-content:center;gap:1px;padding:2px}#panel .eq .cell .ic{width:56%;height:56%}
#panel .eq .cell span{font-size:10px;line-height:1.05;color:var(--ink2)}
#panel .act{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.05)}
#panel .act .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#msg{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.78);padding:8px 16px;border-radius:18px;max-width:80vw;text-align:center;pointer-events:none}
#msg{z-index:3}
#dlg{position:absolute;left:12px;right:84px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(20,24,30,.96);border:2px solid #7f8794;border-radius:10px;padding:12px 14px;pointer-events:auto}
#dlg b{font:700 17px var(--font-d);color:var(--amber);letter-spacing:.03em}
#dlg p{margin:6px 0 8px}#dlg small{color:var(--ink2)}
#mapPanel{position:absolute;inset:0;background:#0e1316;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#mapPanel .in{max-width:560px;margin:0 auto}
#mapPanel h1{font:700 26px var(--font-d);margin:0}
#mapPanel button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 16px var(--font-b)}
#mapPanel .qlist{margin-top:10px;font-size:15px;line-height:1.5}
#mapPanel .qlist .qr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
#mapPanel .qlist .qr.sel{border-left-color:var(--amber);background:rgba(232,169,77,.1)}
#mapPanel .qlist .qr button{min-height:38px;padding:0 12px;flex:none}
#mapPanel .qlist .qb{display:flex;gap:6px;flex:none}
#mapPanel .qlist .qr button.on{border-color:var(--amber);color:var(--amber)}
#mapPanel .leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;color:var(--ink2);font-size:14px}
#mapPanel .leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#panel{position:absolute;inset:0;background:rgba(14,19,22,.99);overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#panel .in{max-width:520px;margin:0 auto}
#panel h2{font:700 20px var(--font-d);margin:18px 0 8px;letter-spacing:.03em}
#panel h1{font:700 26px var(--font-d);margin:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row>*{min-width:0}.mute{color:var(--ink2);font-size:15px}.n{font-variant-numeric:tabular-nums}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--amber)}
#panel button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:700 16px var(--font-b)}
#panel button.danger{border-color:var(--red);color:var(--red)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---- v2 look: carved stone, parchment ink, gold trim ---- */
:root{--ink:#f1e6c8;--ink2:#bfae88;--amber:#e9b857;--gold:#c9a24a;--stone1:#4a3f31;--stone2:#2d261d;--stone3:#1a1510;--red:#c9503e}
body{background:#14110c}
#top{gap:6px;flex-wrap:nowrap;min-width:0}#top>*{flex:none}#hp{flex:1 1 90px!important;min-width:84px!important;max-width:112px!important}#lvl{padding:4px 8px!important;font-size:14px!important}#coins{padding:4px 8px 4px 24px!important;font-size:14px!important}#mapBtn,#bag{min-height:40px!important;padding:0 10px!important;font-size:14px!important;margin-left:0!important}#mapBtn{margin-left:auto!important}
#hp{height:26px;max-width:128px;min-width:100px;border-radius:13px;border:2px solid var(--stone3);background:#2a0f0d;box-shadow:inset 0 0 0 1px #7d6640,0 2px 6px rgba(0,0,0,.5);padding-left:0}

#hp b{font:700 13px var(--font-b);padding-left:16px}

#zone{border:1px solid rgba(255,255,255,.18);background:rgba(20,16,10,.7)}
#quick button{width:62px;height:62px;border-radius:50%;border:3px solid var(--stone3);background:radial-gradient(circle at 35% 28%,#6a5a42,#2c241a 72%);box-shadow:inset 0 0 0 2px #8a7650,0 3px 8px rgba(0,0,0,.55);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:700 11px/1 var(--font-b);text-shadow:0 1px 2px #000}
#quick button svg{width:26px;height:26px;margin-bottom:1px}

#craft,#panel,#mapPanel{background:linear-gradient(180deg,#3a3126,#241e16 60%,#1b1610);color:var(--ink)}

function nearestObj(k,r,from){let fx=pl.x,fy=pl.y;for(let i=0;i<M.obj.length;i++)if(M.obj[i]===from){fx=i%M.W;fy=(i/M.W)|0;break}
  let best=null,bd=99;for(let y=Math.max(0,fy-r);y<=Math.min(M.H-1,fy+r);y++)for(let x=Math.max(0,fx-r);x<=Math.min(M.W-1,fx+r);x++){
  const o=M.obj[y*M.W+x];if(o&&o.k===k&&o!==from&&o.dep<=tickN+3){const d=Math.hypot(x-pl.x,y-pl.y);if(d<bd){bd=d;best={type:'obj',o,x,y}}}}return best}

const SND=(()=>{

  const init=()=>{if(ctx||!AC)return;try{ctx=new AC();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);
    sfxG=ctx.createGain();sfxG.gain.value=cfg().vs??1;sfxG.connect(master);musG=ctx.createGain();musG.gain.value=.5*(cfg().vm??1);musG.connect(master);
    const dl=ctx.createDelay(1);dl.delayTime.value=.34;const fb=ctx.createGain();fb.gain.value=.38;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
    wet=ctx.createGain();wet.gain.value=.5;wet.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(musG);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ctx=null}};
  const resume=()=>{init();if(ctx&&ctx.state!=='running')ctx.resume();if(ctx&&!started){started=true;timer=setInterval(sched,200)}};
  ['pointerdown','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,resume,{passive:true}));
  const ok=()=>ctx&&ctx.state==='running';
  function tone(f,dur,type,vol,slide,dest,at){const t=at||ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.012,dur/4));g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.03);return g}

    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(fl);fl.connect(g);g.connect(sfxG);s.start(t);s.stop(t+dur+.03)}

  const FX={

    miss:()=>noise(.07,.07,'highpass',3000,1200),

    gale:()=>noise(.32,.14,'bandpass',500,2200),
    void:()=>{tone(90,.4,'sawtooth',.12,40);tone(540,.3,'sine',.05,150)},
    tele:()=>{tone(220,.6,'sine',.1,1800);tone(330,.6,'triangle',.05,2400)},
    warn:()=>{tone(520,.12,'square',.06);tone(520,.12,'square',.06,0,sfxG,ctx.currentTime+.18)},
    slam:()=>{tone(90,.3,'sine',.25,40);noise(.2,.2,'lowpass',500,100)},
    level:()=>arp([523,659,784,1047],.11,'triangle',.12),

  const N=(m)=>440*Math.pow(2,(m-69)/12);

    village:{root:60,scale:[0,2,4,7,9],chords:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],tempo:74,dens:.45,pad:'sine',lead:'triangle',oct:12},

    mood(m){if(m===mood)return;mood=m;if(ctx&&musG){musG.gain.cancelScheduledValues(ctx.currentTime);musG.gain.setValueAtTime(musG.gain.value,ctx.currentTime);musG.gain.linearRampToValueAtTime(.001,ctx.currentTime+.4);musG.gain.linearRampToValueAtTime(cfg().mus?.5*(cfg().vm??1):0,ctx.currentTime+1.6)}},

function genBounties(){
  const day=dayKey(),R=mulberry32(hashStr('d'+day)),ri2=(a,b)=>a+Math.floor(R()*(b-a+1)),c=lvOf('combat');
  const kinds=Object.keys(MOBS).filter(k=>!MOBS[k].boss&&!MOBS[k].prey&&MOBS[k].lv&&MOBS[k].lv<=c+8&&MOBS[k].lv>=Math.max(1,c-10)),plural=w=>/(s|x|h)$/.test(w)?w+'es':/f$/.test(w)?w.slice(0,-1)+'ves':/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':w+'s';if(!kinds.length)kinds.push('tunnel');
  const ores=Object.keys(NEED).filter(k=>MXP[k]&&ITEMS[k+'_ore']&&lvOf('mining')>=NEED[k]).map(k=>[k+'_ore',NEED[k],Math.max(5,MXP[k]*1.4|0)]);
  const woods=[{n:'logs',item:'logs',xp:14},...Object.values(TREESPECS).flat().filter(t=>lvOf('woodcutting')>=t.lv&&t.item!=='logs')],fishes=Object.values(FISHSP).filter(f=>lvOf('fishing')>=f.lv);
  const mk=t=>{
    if(t==='kill'){const k=kinds[Math.floor(R()*kinds.length)],n=ri2(6,14),lv=MOBS[k].lv;return{type:'kill',tgt:k,n,prog:0,label:'Slay '+n+' '+plural(MOBS[k].n.toLowerCase()),coins:n*(lv*3+8),xp:['combat',n*(lv*6+20)]}}
    if(t==='mine'){const o=ores[Math.floor(R()*ores.length)],n=ri2(10,24);return{type:'mine',tgt:o[0],n,prog:0,label:'Mine '+n+' '+ITEMS[o[0]].n.toLowerCase(),coins:n*o[2]*2,xp:['mining',n*o[2]*3]}}
    if(t==='chop'){const w=woods[Math.floor(R()*woods.length)],n=ri2(14,30);return{type:'chop',tgt:w.item,n,prog:0,label:'Chop '+n+' '+ITEMS[w.item].n.toLowerCase(),coins:n*Math.round(w.xp*.6),xp:['woodcutting',n*Math.round(w.xp*2.1)]}}
    if(t==='fish'){const f=fishes[Math.floor(R()*fishes.length)]||FISHSP.fish,n=ri2(10,22);return{type:'fish',tgt:f.item,n,prog:0,label:'Catch '+n+' '+ITEMS[f.item].n.toLowerCase(),coins:n*Math.round(f.xp*.9),xp:['fishing',n*Math.round(f.xp*2.5)]}}
    if(t==='catch'){const n=ri2(5,10);return{type:'catch',tgt:'any',n,prog:0,label:'Hunt '+n+' rabbits or foxes',coins:n*22,xp:['hunting',n*80]}}
    const n=ri2(4,9);return{type:'craft',tgt:'any',n,prog:0,label:'Smelt, forge or craft '+n+' times',coins:n*30,xp:['smithing',n*60]}};
  const pool=['mine','chop','fish','catch','craft'];const picks=['kill'];while(picks.length<3){const t=pool[Math.floor(R()*pool.length)];if(!picks.includes(t))picks.push(t)}
  S.bounty.day=day;S.bounty.list=picks.map(mk);for(const b of S.bounty.list){b.claimed=false;b.gem=R()<.12}
  const wk=weekKey();if(S.bounty.week!==wk){const R2=mulberry32(hashStr('w'+wk)),t=['kill','chop','craft'][Math.floor(R2()*3)];S.bounty.week=wk;
    S.bounty.weekly=t==='kill'?{type:'kill',tgt:'any',n:60,prog:0,label:'Slay 60 monsters this week',coins:1800,xp:['combat',9000]}:t==='chop'?{type:'chop',tgt:'logs',n:150,prog:0,label:'Chop 150 logs this week',coins:1500,xp:['woodcutting',9000]}:{type:'craft',tgt:'any',n:40,prog:0,label:'Smelt, forge or craft 40 times this week',coins:1600,xp:['smithing',9000]};S.bounty.weekly.claimed=false;S.bounty.weekly.gem=true}}
function ensureBounties(){S.bounty=S.bounty||{day:'',week:'',list:[],weekly:null};if(S.bounty.day!==dayKey()||!S.bounty.list.length)genBounties()}
function bp(type,tgt,n){n=n||1;ensureBounties();const all=[...S.bounty.list,S.bounty.weekly].filter(Boolean);
  for(const b of all){if(b.claimed||b.prog>=b.n||b.type!==type)continue;if(b.tgt!=='any'&&b.tgt!==tgt)continue;b.prog=Math.min(b.n,b.prog+n);if(b.prog>=b.n){sfx('quest');toast('Bounty ready',b.label+' · claim it in the Bag, Goals tab')}}}
function claimBounty(i){ensureBounties();const b=i==='w'?S.bounty.weekly:S.bounty.list[Number(i)];if(!b||b.claimed||b.prog<b.n)return;b.claimed=true;S.coins+=b.coins;addXp(b.xp[0],b.xp[1]);if(b.gem){const g=GEMS[Math.random()<.7?0:Math.random()<.7?1:2];giveItem(g,1);say('Bounty reward: '+b.coins+' coins and a '+ITEMS[g].n+'!')}else say('Bounty reward: '+b.coins+' coins.');sfx('coin');save()}

  let h='<div class="mute">Check the notice board in town for new bounties. Daily bounties refresh at midnight, the weekly one each week.</div><h2>Daily bounties</h2>'+S.bounty.list.map((b,i)=>row(b,i,'')).join('');

  h+=ACH.slice().sort((a,b)=>(S.ach&&S.ach[a.id]?1:0)-(S.ach&&S.ach[b.id]?1:0)).map(a=>{const d=S.ach&&S.ach[a.id],p=a.p?a.p():null;return'<div class="row" style="opacity:'+(d?.55:1)+'"><div style="flex:1"><b>'+(d?'✓ ':'')+a.n+'</b><div class="mute">'+a.d+(p?' ('+Math.min(p[0],p[1])+'/'+p[1]+')':'')+' · '+a.r.coins+' coins</div>'+(!d&&p?bar(p[0],p[1]):'')+'</div></div>'}).join('');
  return h}

function tutMark(){if(S.tut.done)return null;const st=TUT[S.tut.s];if(!st)return null;const id=st.id,W_=WORLD,find=(mp,k)=>{const e=(mp.objs||[]).find(q=>q.o.k===k);return e?{x:e.x,y:e.y}:null};

function nqMarksIn(mp){const out=[];for(const q of NQ){const npc=(mp.npcs||[]).find(n=>n.role===q.role);if(!npc||q.req&&S.nq[q.req]!==2)continue;const st=S.nq[q.id]||0;if(st===0)out.push({kind:'give',x:npc.x,y:npc.y,label:q.name+': speak to '+npc.name,key:'nq_'+q.id});else if(st===1&&nqProg(q)>=q.need.n)out.push({kind:'turn',x:npc.x,y:npc.y,label:q.name+': report to '+npc.name,key:'nq_'+q.id})}return out}

      if(best)add('goal',best.x,best.y,"Mara's Brew: herbs "+h+'/8');out.herbsActive=true}else add('turn',mara.x,mara.y,"Mara's Brew: bring herbs to Mara")}

const trNear=n=>{const p=NETR.cache.get(n);return !!(p&&p.m===mapId(M)&&Math.max(Math.abs(p.x-pl.x),Math.abs(p.y-pl.y))<=8)};

function trRequest(name){if(!NET.online||!NET.session){say('Trading needs the online game.');return}if(TR.w){say('You are already trading.');return}if(!trNear(name)){say('Too far away to trade. Stand close to '+name+'.');return}
  TR.pend=name;NET.toPlayer(name,{k:'tr',a:'req'});say('Trade request sent to '+name+'.');setTimeout(()=>{if(TR.pend===name){TR.pend=null;say(name+' did not answer.')}},20000)}

function trOffer(){TR.okMine=TR.okTheirs=false;NET.toPlayer(TR.w,{k:'tr',a:'off',items:TR.mine.items,coins:TR.mine.coins});trRender()}
function trClean(o){const items={};let n=0;for(const k in(o&&o.items)||{}){if(!trOk(k)||n>=28)continue;const v=Math.floor(Number(o.items[k]));if(v>=1&&v<=99999){items[k]=v;n++}}
  return{items,coins:Math.max(0,Math.min(1e9,Math.floor(Number(o&&o.coins))||0))}}
function trValid(){for(const k in TR.mine.items)if((S.inv[k]||0)<TR.mine.items[k])return false;return S.coins>=TR.mine.coins}
function netTrade(from,ev){const a=ev.a;
  if(a==='req'){if(TR.w||TR.inc||!NET.session||!trNear(from)){NET.toPlayer(from,{k:'tr',a:'no'});return}TR.inc=from;const el=$('trprompt');el.innerHTML='<div class="in"><b>'+esc(from)+'</b> wants to trade.<div class="btns"><button data-tp="acc">Accept</button><button data-tp="dec">Decline</button></div></div>';el.hidden=false;sfx('quest');setTimeout(()=>{if(TR.inc===from&&!TR.w){TR.inc=null;el.hidden=true;NET.toPlayer(from,{k:'tr',a:'dec'})}},20000);return}
  if(a==='no'||a==='dec'){if(TR.pend===from){TR.pend=null;say(a==='no'?from+' cannot trade right now.':from+' declined the trade.')}return}
  if(a==='acc'){if(TR.pend===from&&!TR.w){TR.pend=null;trStart(from)}return}

function trConfirm(){if(!TR.w)return;if(!trNear(TR.w)){trClose('You moved too far away. Trade cancelled.');NET.toPlayer(TR.w,{k:'tr',a:'cnl'});return}if(!trValid()){say('You no longer have everything you offered.');return}

    '<div class="trk">Coins: <button data-tcoin="100">+100</button><button data-tcoin="1000">+1k</button><button data-tcoin="10000">+10k</button> <span class="mute">you have '+S.coins+'</span></div><h4>Your backpack</h4><div class="tinv">'+(inv||'<div class="mute">Nothing left to offer</div>')+'</div>'+
    '<div class="btns"><button data-tok="1" '+(TR.okMine?'disabled':'')+'>'+(TR.okMine?'Waiting for '+esc(TR.w)+'...':'Confirm trade')+'</button><button data-tcancel="1">Cancel</button></div><div class="mute" style="margin-top:6px;font-size:13px">Any change resets both confirmations. Check what they offer before you confirm.</div></div>'}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;

const CHANGES=[{v:'2026-10-17.4',title:'Farming, milestones and settings',lines:['New skill: Farming. The Millbrook fields now have six crops (potato, wheat, cabbage, carrot, onion, pumpkin) with level requirements, and harvesting trains Farming instead of Alchemy.','Milestones: a reward and pop-up when you reach level 10, 25, 50 and 80 in any skill.','Daily bounties now use Kingsmarch resources and monsters at your level (specific fish, logs, ores). There is a bounty board in Highcrown.','Settings: separate volume sliders for sound effects and music, and a button size option.']},{v:'2026-10-17.3',title:'Trading and shared boss loot',lines:['Trade with other players: tap a player standing close to you and choose Trade. Both of you offer items and coins, both confirm, then the exchange happens. Any change resets the confirmations.','Boss loot is shared: everyone who did at least 10% of a boss\'s health gets their own loot roll, XP and kill credit, not only the player who lands the last hit.']},{v:'2026-10-17.2',title:'Minimap and quest rewards',lines:['Minimap in the top right: your position, shops, doors, bosses, quest markers and an arrow to your tracked quest. Tap it for the big map. Turn it off in Settings.','Quest complete pop-up when you hand in a quest, with everything you received.','Monster names and levels are now shown above every monster nearby.']},{v:'2026-10-17.1',title:'Boss fights, balance and loading',lines:['Bosses now target the player who did the most damage, and ground attacks and orbs reach everyone in a shared fight, not just the host.','Woodcutting and fishing balanced against mining: high-level trees give less XP per log, fish give more.','Faster start: areas are built the first time you enter them. Expect a short loading moment when you enter Kingsmarch, Mistfen and other areas.','New icons: pets, companions, boss drops, fish species and more.','Codex regions fold open and closed. Tracking a quest in another region now points you to the next door, gate or bridge.']},{v:'2026-10-16.3',title:'Armour types',lines:['Armour now looks different per type: heavy plate, light leather (vests, hoods, bucklers) and cloth for mages (robes, hats, tomes). The item description names the type.']},{v:'2026-10-16.2',title:'Better icons',lines:['Item icons in the Bag have outlines, shading and highlights. Helmets, armour, shields and pickaxes are redrawn.','The XP bars now show the skill icon.']},{v:'2026-10-16.1',title:'Journal, map legend and icons',lines:['Quests tab rebuilt: every quest in the game (also Mistfen and Kingsmarch) with progress bars, rewards, where to find the giver and a Track button. Filter on Active, Available, Done.','Codex rebuilt: a bestiary per region with kill counts and a collection log of rare drops, gems and pets.','The map legend now shows only what is really on the map you are looking at, with the same icons.','New, more realistic and distinct skill icons.','Quest markers now also work in Mistfen and Kingsmarch. The tutorial no longer shows up for experienced characters.']},{v:'2026-10-15.1',title:'Kingsmarch and more',lines:['KINGSMARCH: a whole new mainland. Walk east over the bridge from the island. Millbrook (farming), Saltgate Harbour and Highcrown, the walled capital with a castle, markets and shops you can walk into.','New training: birch, elm and redwood trees, coal and aurelite ore, tuna and sharks, pheasants and elk, crops to pick, and aurelite gear.','New monsters, three new bosses and rare treasure drops. Friendly animals only fight back if you attack them.','Safe zones and multi-combat areas are now clearly marked in the world and on the map. The map shows shops, smithies, mines, dungeons, bosses and more with icons and a legend.','The Skills tab has icons and a guide for every skill.','Gathering is no longer interrupted by monsters hitting you. Weaker monsters ignore you at high level.','Hunting is easier: game runs slower and you can catch it from two tiles.']},{v:'2026-10-14.2',title:'Soulrend update',lines:['Gems and pearls now have icons in your bag.','Axes: rusty, copper, iron and steel up to ember. Buy them at the Armoury or forge them at the anvil. Better axes chop faster and more often.','Settings tab in your Bag with controls, sound, graphics and log out.','Smoother XP bars.','You are logged out after 30 minutes without activity.','Close buttons in shops stay in view while you scroll.']}];

function netBind(ws){NET.ws=ws;ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}netHandle(m)};
  ws.onclose=()=>{if(NET.ws!==ws)return;NET.ws=null;if(!NET.session)return;chatAdd({r:'sys',text:'Disconnected. Trying to reconnect...'});NETR.clear();NET.retry=setTimeout(netReconnect,3000)}}
async function netReconnect(){if(!NET.session||!NET.online||!NET.cred)return;try{const ws=await netOpen(NET.url);const w=await netAuth(ws,'login',NET.cred.name,NET.cred.pass);netBind(ws);NET.role=w.role;chatAdd({r:'sys',text:'Reconnected.'});NET.lastPos=''}catch(e){NET.retry=setTimeout(netReconnect,5000)}}
function netAuth(ws,kind,name,pass,save){return new Promise((res,rej)=>{ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}if(m.t==='welcome')res(m);else if(m.t==='error')rej(new Error(m.m))};ws.onclose=()=>rej(new Error('Connection closed.'));ws.send(JSON.stringify({t:kind,name,pass,save,proto:PROTO,build:BUILD}))})}

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)}}
const locIdx=()=>{try{return JSON.parse(localStorage.getItem(LOC_IDX)||'{}')}catch(e){return{}}};

async function doLogin(register){
  const err=$('lgErr');err.textContent='';const name=$('lgName').value.trim(),pass=$('lgPass').value,url=normUrl($('lgServer').value);
  if(name.length<3||!/^[A-Za-z0-9_ -]{3,16}$/.test(name)){err.textContent='Name: 3-16 letters, numbers, space, - or _.';return}
  if(pass.length<4){err.textContent='Password: at least 4 characters.';return}
  const legacy=!$('lgLegacyRow').hidden&&$('lgLegacy').checked&&register;
  $('lgLogin').disabled=$('lgReg').disabled=true;err.textContent='Connecting...';
  try{
    if(url){const ws=await netOpen(url);let legacySave=null;if(legacy){try{legacySave=JSON.parse(localStorage.getItem(LEGACY_KEY))}catch(e){}}
      const w=await netAuth(ws,register?'register':'login',name,pass,legacySave);NET.url=url;NET.cred={name:w.name,pass};netBind(ws);
      beginSession({name:w.name,role:w.role,online:true,save:w.save||legacySave})}
    else{const idx=locIdx(),k=name.toLowerCase();
      if(register){if(idx[k])throw new Error('That name already exists on this device.');const salt=Math.random().toString(36).slice(2);idx[k]={name,salt,hash:await sha(salt+pass)};localStorage.setItem(LOC_IDX,JSON.stringify(idx))}
      else{if(!idx[k]||idx[k].hash!==await sha(idx[k].salt+pass))throw new Error('Wrong name or password.')}
      NET.url='';beginSession({name:idx[k].name,role:'player',online:false,save:register?null:localStorage.getItem('soulrend-save-'+k),legacy})}
    err.textContent=''
  }catch(e){err.textContent=e.message||'Something went wrong.'}
  $('lgLogin').disabled=$('lgReg').disabled=false}
